name: Task 61.22B isolated readiness management

on:
  push:
    branches: [feature/task61-22b-durable-management-admission, feature/task61-22c-canonical-runtime-certification]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  isolated-readiness:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The declared replit-object-storage dependency supports Python <3.13.
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies and disposable PostgreSQL binaries
        run: |
          python -m pip install -r backend/requirements.txt
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Supported runtime and real SDK import without client or network
        run: |
          python scripts/certify_readiness_supported_runtime.py | tee supported-runtime-certification.txt
      - name: Focused management, real PostgreSQL and migration regressions
        run: |
          python scripts/run_isolated_readiness_tests.py --with-postgres -q \
            tests/test_object_storage_readiness_management.py \
            tests/test_readiness_execution_runner.py \
            tests/test_readiness_execution_admission_0032.py \
            tests/test_readiness_execution_orchestration.py \
            --junitxml=readiness-focused-results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("backend/readiness-focused-results.xml").getroot()
          assert not root.findall(".//skipped"), "Required PostgreSQL tests must not skip"
          PY
      - name: Relevant existing safety, authentication, startup and migration tests
        run: |
          python scripts/run_isolated_readiness_tests.py --with-postgres -q \
            tests/test_auth.py \
            scripts/tests/test_object_storage_readiness.py \
            tests/test_start_production.py \
            tests/test_production_startup_readiness.py \
            tests/test_schema_canonicality_guard.py \
            tests/test_migration_schema_adoption.py \
            tests/test_migration_schema_repair_0020.py \
            tests/test_migration_schema_repair_0028.py \
            tests/test_migration_autonomous_retry_lineage_0030.py \
            tests/test_managed_schema_adoption_0031.py \
            tests/test_media_storage.py \
            tests/test_task61_14_test_isolation.py \
            --junitxml=readiness-compatibility-results.xml
      - name: Dependency, compilation and patch checks
        run: |
          python -m pip check
          python -m compileall -q backend/app backend/scripts backend/alembic scripts
          git diff --check
      - name: Exact validation summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ("focused", "compatibility"):
              path = Path(f"backend/readiness-{name}-results.xml")
              if not path.exists():
                  print(f"{name}: report unavailable")
                  continue
              root = ET.parse(path).getroot()
              for suite in root.iter("testsuite"):
                  print(f"{name}: {suite.attrib}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-test-results-${{ matrix.python }}
          path: |
            backend/readiness-*-results.xml
            supported-runtime-certification.txt