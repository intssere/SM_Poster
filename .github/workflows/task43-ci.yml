name: Task 43 branch certification

on:
  push:
    branches:
      - task-43-exact-one-shot-routine-dispatch-v2

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app tests
      - name: Focused Task 43 tests
        run: pytest -q tests/test_routine_one_shot_live.py tests/test_routine_pinterest_publishing_foundation.py
      - name: Full backend tests
        run: pytest -q
