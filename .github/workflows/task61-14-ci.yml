name: Task 61.14 durable canary media

on:
  push:
    branches:
      - feature/task61-14-durable-canary-media
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  durable-canary-media:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sm_poster_task595_task6114
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sm_poster_task595_task6114"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: "sqlite:///:memory:"
      TASK595_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task595_task6114"
      TASK58_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task595_task6114"
      TASK46_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task595_task6114"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies and disposable PostgreSQL binaries
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Scrub provider and hosted-storage credentials from later test steps
        shell: bash
        run: |
          while IFS='=' read -r name _; do
            case "$name" in
              REPLIT_*|REPL_*|PINTEREST_*|BUFFER_*|OPENAI_*|AWS_*|GOOGLE_APPLICATION_CREDENTIALS|OBJECT_STORAGE_*)
                printf '%s=\n' "$name" >> "$GITHUB_ENV"
                ;;
            esac
          done < <(env)
      - name: Durable media, Task 61.6A, Task 61.1, Task 59.5/59.6, and compatibility regressions
        run: >-
          pytest -q
          tests/test_pinterest_local_canary_durable_media.py
          tests/test_task61_14_media_consumers.py
          tests/test_task61_14_test_isolation.py
          tests/test_pinterest_local_canary_fixture_durable_postgres.py
          tests/test_pinterest_local_canary_fixture_postgres.py
          tests/test_pinterest_local_canary_media.py
          tests/test_local_canary_admission.py
          tests/test_pinterest_autonomous_generation.py
          tests/test_pinterest_autonomous_execution.py
          tests/test_routine_canary_fixture.py
          tests/test_routine_canary_fixture_postgres.py
          tests/test_routine_certified_canary.py
          tests/test_routine_certified_canary_preflight.py
          tests/test_routine_certified_live.py
          tests/test_routine_one_shot_live.py
          tests/test_routine_scheduler_canary.py
          tests/test_routine_scheduler_canary_postgres.py
          tests/test_routine_pinterest_scheduler.py
          tests/test_routine_scheduler_postgres_lease.py
          tests/test_scheduled_autonomous_readiness.py
          tests/test_routine_scheduled_dry_run_postgres.py
          tests/test_routine_scheduled_admission_postgres.py
          tests/test_routine_operational_readiness.py
          tests/test_schema_canonicality_guard.py
          tests/test_routine_pinterest_publishing_foundation.py
          tests/test_media_storage.py
          tests/test_pin_proposals.py
          tests/test_buffer_publication_routes.py
          tests/test_publications_api.py
          tests/test_publication_scheduler.py
          tests/test_publication_candidate_preflight.py
          tests/test_publication_candidate_preflight_postgres.py
          tests/test_publication_reconciliation.py
          tests/test_creative_rendering.py
          tests/test_auth.py
          tests/test_publication_identity.py
          tests/test_pinterest_publication_quality.py
          tests/test_publication_state.py
          tests/test_publication_preview.py
          tests/test_publication_duplicates.py
          tests/test_manual_publication_dispatch.py
      - name: Syntax and patch checks
        run: |
          python -m pip check
          python -m compileall -q app tests
          git diff --check