name: Task 59.5 certified offline canary

on:
  push:
    branches:
      - task-59-5-certified-offline-canary
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sm_poster_task595_${{ matrix.postgres }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sm_poster_task595_${{ matrix.postgres }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: "sqlite:///:memory:"
      TASK595_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task595_${{ matrix.postgres }}"
      TASK58_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task595_${{ matrix.postgres }}"
      TASK58_CATALOG_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task595_catalog_${{ matrix.postgres }}"
      TASK46_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task46_${{ matrix.postgres }}"
      TASK501_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task501_${{ matrix.postgres }}"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Canonical main ancestry guard
        run: git merge-base --is-ancestor 133081d01f2a51cb713878ac7c3edf1ddf47f92d HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Dependency and syntax checks
        run: |
          python -m pip check
          python -m compileall -q app tests scripts
          git diff --check

      - name: Prepare disposable PostgreSQL databases and verify schema head
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres sm_poster_task595_catalog_${{ matrix.postgres }}
          createdb -h 127.0.0.1 -U postgres sm_poster_task501_${{ matrix.postgres }}
          createdb -h 127.0.0.1 -U postgres sm_poster_task46_${{ matrix.postgres }}
          export DATABASE_URL="${TASK58_CATALOG_URL}"
          alembic upgrade head
          alembic current | grep -Fx '0030 (head)'

      - name: Certified offline canary and dependent regressions
        run: >-
          pytest -q
          tests/test_routine_certified_canary.py
          tests/test_routine_canary_fixture.py
          tests/test_routine_canary_fixture_postgres.py
          tests/test_routine_pinterest_publishing_foundation.py
          tests/test_routine_one_shot_live.py

      - name: Full backend regression suite
        run: pytest -q
