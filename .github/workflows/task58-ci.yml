name: Task 58 autonomous board ensure coordinator

on:
  push:
    branches:
      - task-58-autonomous-board-ensure-v3
      - task-58-1-exact-0020-repair-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sm_poster_task58_${{ matrix.postgres }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sm_poster_task58_${{ matrix.postgres }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: "sqlite:///:memory:"
      TASK58_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task58_${{ matrix.postgres }}"
      TASK58_CATALOG_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task58_catalog_${{ matrix.postgres }}"
      TASK46_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task46_${{ matrix.postgres }}"
      TASK501_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task501_${{ matrix.postgres }}"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exact canonical ancestry guard
        run: |
          test "$(git rev-parse HEAD)" != "81b2da658cdc8ea9ecd3f0730c8cbb16a2c546b7"
          git merge-base --is-ancestor 81b2da658cdc8ea9ecd3f0730c8cbb16a2c546b7 HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app tests scripts

      - name: Prepare isolated PostgreSQL databases and certify Alembic head
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h 127.0.0.1 -U postgres sm_poster_task58_catalog_${{ matrix.postgres }}
          createdb -h 127.0.0.1 -U postgres sm_poster_task501_${{ matrix.postgres }}
          createdb -h 127.0.0.1 -U postgres sm_poster_task46_${{ matrix.postgres }}
          export DATABASE_URL="${TASK58_CATALOG_URL}"
          alembic upgrade head
          alembic current 2>&1 | tee /tmp/task58-current
          grep -Fx '0027 (head)' /tmp/task58-current

      - name: Task 58 focused and dependent regressions
        run: >-
          pytest -q
          tests/test_migration_schema_adoption.py
          tests/test_migration_schema_repair_0020.py
          tests/test_production_alembic_0020_reconciler.py
          tests/test_start_production.py
          tests/test_production_startup_readiness.py
          tests/test_routine_scheduler_postgres_lease.py
          tests/test_pinterest_autonomous_execution.py
          tests/test_pinterest_optimizer_apply.py
          tests/test_pinterest_adaptive_optimizer.py
          tests/test_pinterest_learning_ranking.py
          tests/test_pinterest_performance_analytics.py
          tests/test_pinterest_autonomous_generation.py
          tests/test_pinterest_seo_intelligence.py
          tests/test_pinterest_portfolio_planner.py
          tests/test_pinterest_board_strategy.py
          tests/test_routine_autonomous_authorization.py
          tests/test_routine_activation_readiness.py
          tests/test_routine_operational_readiness.py
          tests/test_routine_pinterest_scheduler.py
          tests/test_routine_pinterest_publishing_foundation.py
          tests/test_routine_one_shot_live.py

      - name: Full backend tests
        if: matrix.postgres == '16'
        run: pytest -q
