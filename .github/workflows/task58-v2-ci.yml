name: Task 58 v2 branch certification

on:
  push:
    branches:
      - task-58-replit-preapplied-schema-adoption-v2

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sm_poster_task58
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sm_poster_task58"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: "sqlite:///:memory:"
      TASK58_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task58"
      TASK501_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task58"
      TASK46_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task58"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend and production scripts
        run: |
          python -m compileall -q app tests
          python -m py_compile ../scripts/start_production.py
      - name: PostgreSQL pre-applied schema adoption proofs
        run: pytest -q tests/test_preapplied_schema_adoption.py
      - name: Production migration recovery regressions
        run: pytest -q tests/test_production_alembic_0020_reconciler.py tests/test_start_production.py
      - name: Focused Task 57 through Task 46 regressions
        run: >-
          pytest -q
          tests/test_pinterest_autonomous_execution.py
          tests/test_pinterest_optimizer_apply.py
          tests/test_pinterest_adaptive_optimizer.py
          tests/test_pinterest_learning_ranking.py
          tests/test_pinterest_performance_analytics.py
          tests/test_pinterest_autonomous_generation.py
          tests/test_pinterest_seo_intelligence.py
          tests/test_pinterest_portfolio_planner.py
          tests/test_pinterest_board_strategy.py
          tests/test_routine_autonomous_authorization.py
          tests/test_routine_activation_readiness.py
          tests/test_routine_operational_readiness.py
          tests/test_routine_pinterest_scheduler.py
          tests/test_routine_pinterest_publishing_foundation.py
          tests/test_routine_one_shot_live.py
      - name: PostgreSQL distributed lease integration
        run: pytest -q tests/test_routine_scheduler_postgres_lease.py
      - name: Full backend tests
        run: pytest -q
