name: Task 45 branch certification

on:
  push:
    branches:
      - task-45-routine-operational-alerts-v2

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: "sqlite:///:memory:"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app tests
      - name: Focused Task 45 tests
        run: pytest -q tests/test_routine_operational_readiness.py tests/test_routine_pinterest_scheduler.py tests/test_routine_pinterest_publishing_foundation.py tests/test_routine_one_shot_live.py
      - name: Full backend tests
        run: pytest -q
