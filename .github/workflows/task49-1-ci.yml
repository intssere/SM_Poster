name: Task 49.1 branch certification

on:
  push:
    branches:
      - task-49-1-production-alembic-startup-gate

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sm_poster_task491
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sm_poster_task491"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: "sqlite:///:memory:"
      TASK491_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sm_poster_task491"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend and production launcher
        run: |
          python -m compileall -q app tests
          python -m py_compile ../scripts/start_production.py
      - name: Production startup gate tests
        run: pytest -q tests/test_start_production.py
      - name: PostgreSQL fresh upgrade through 0019
        env:
          DATABASE_URL: ${{ env.TASK491_POSTGRES_URL }}
        run: |
          alembic upgrade head
          alembic current | grep 0019
      - name: Task 49 board regression
        run: pytest -q tests/test_pinterest_board_strategy.py tests/test_pinterest_oauth.py tests/test_pinterest_boards.py
      - name: Full backend tests
        run: pytest -q
